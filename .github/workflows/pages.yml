name: Build and deploy field lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_content.py
      - run: python scripts/execute_content.py
      - run: jupyter lite build --contents content --output-dir _site/lab
      - run: jupyter-book build content
      - name: Assemble site
        run: |
          mkdir -p _site/book _site/scenes _site/assets
          cp -R content/_build/html/. _site/book/
          cp -R scenes/. _site/scenes/
          cp -R assets/. _site/assets/
          cp assets/veoc-splash.svg _site/book/veoc-splash.svg
          cp assets/workflow.svg _site/book/workflow.svg
          cat > _site/index.html <<'EOF'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OSIRIS VEOC Field Lab</title><style>body{max-width:900px;margin:5rem auto;padding:2rem;background:#071727;color:#eef;font:20px system-ui}a{color:#7ce4dd}img{max-width:100%;border-radius:16px}</style><img src="assets/veoc-splash.svg" alt="OSIRIS VEOC mission board"><h1>OSIRIS VEOC Field Lab</h1><p>Explore public signals, verify evidence, and brief with uncertainty using fictional exercise data.</p><p><a href="book/">Read the Book</a> · <a href="lab/index.html">Run JupyterLite</a> · <a href="scenes/operations-2d.html">2D map</a> · <a href="scenes/operations-3d.html">3D scene</a> · <a href="https://osirisai.live/">OSIRIS</a></p></html>
          EOF
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
